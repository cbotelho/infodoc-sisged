<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Etiqueta Fixa 12x21</title>
<style type="text/css">
@page {
    size: 12cm 22cm;
    margin: 0;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #f0f0f0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding-top: 10px;
}

/* CONTAINER PRINCIPAL COM TRAVA RÍGIDA */
.etiqueta {
    width: 12cm;
    height: 21cm;
    background: #43449b;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* HEADER - Altura fixa */
.header {
    height: 3.1cm;
    padding: 0.18cm 0.2cm;
    text-align: center;
    color: #ffffff;
    flex-shrink: 0;
}

.header h1 { font-size: 20px; line-height: 1; }
.header h3 { font-size: 6px; margin: 2px 0; text-transform: uppercase; }
.header-divider { width: 94%; height: 2px; margin: 4px auto; background: #fff; }
.project-title { font-size: 6px; text-transform: uppercase; margin-bottom: 5px; }

.top-fields { display: grid; grid-template-columns: 1.8fr 1fr; gap: 5px; }
.field-title { font-size: 6px; font-weight: bold; text-transform: uppercase; text-align: left; }
.field-box { height: 0.45cm; background: #fff; color: #000; font-size: 7px; font-weight: bold; display: flex; align-items: center; padding: 0 4px; }
.field-stack { display: flex; flex-direction: column; gap: 3px; }
.field-stack-row { display: grid; grid-template-columns: 1fr 1.1cm; gap: 4px; align-items: center; }

/* ÁREA DE CONTEÚDO BRANCO */
.content {
    flex: 1; /* Ocupa o restante do espaço até o footer */
    padding: 0 0.2cm;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.content-panel {
    background: #ffffff;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0.1cm;
    min-height: 0;
    overflow: hidden;
}

/* ÁREA DO ASSUNTO COM TRAVA DE 20 LINHAS */
.assuntos-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.assuntos-box strong {
    font-size: 7px;
    text-transform: uppercase;
    display: block;
    margin-bottom: 2px;
}

.assuntos-content {
    flex: 1;
    overflow: hidden;
    /* Cálculo para 20 linhas: 
       Se o font-size é 8px e line-height é 1.2, cada linha tem 9.6px.
       20 linhas = 192px. Ajustei para garantir que caiba no espaço físico disponível. */
    max-height: 14.5cm; 
}

.assuntos-content table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.assuntos-content th, .assuntos-content td {
    border: 1px solid #000;
    font-size: 8px; /* Tamanho ajustado para caber 20 linhas confortavelmente */
    line-height: 1.2;
    padding: 2px;
    text-align: left;
    vertical-align: top;
    word-wrap: break-word;
}

/* ÁREA DAS LOGOS - Sempre acima do footer */
.logos-strip {
    height: 2.45cm;
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid #ccc;
    flex-shrink: 0;
}

.logo-card img {
    height: 1.8cm; /* Reduzi levemente para segurança */
    width: auto;
}

/* FOOTER - Altura fixa */
.footer {
    height: 2.45cm;
    padding: 0.2cm;
    flex-shrink: 0;
}

.footer-fields {
    display: grid;
    grid-template-columns: 2cm 1fr;
    gap: 0.2cm;
    height: 2.05cm;
}

.qrcode-panel {
    background: #fff;
    width: 2cm;
    height: 2cm;
    display: flex;
    align-items: center;
    justify-content: center;
}

.caixa-panel {
    background: #fff;
    flex: 1;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.caixa-numero {
    font-size: 78px;
    font-weight: bold;
    text-align: right;
}

@media print {
    body { padding: 0; background: none; }
    .etiqueta { border: none; box-shadow: none; }
}
</style>
</head>
<body>

<div class="etiqueta">
    <div class="header">
        <h1>CASA CÍVIL</h1>
        <h3>SECRETARIA DE ESTADO DA CASA CÍVIL</h3>
        <div class="header-divider"></div>
        <div class="project-title">PROJETO GESTÃO INTEGRADA DE DOCUMENTOS</div>

        <div class="top-fields">
            <div>
                <div class="field-title">Setor</div>
                <div class="field-box">{#434:Setor}</div>
            </div>
            <div class="field-stack">
                <div class="field-stack-row">
                    <span class="field-title">Estante</span>
                    <div class="field-box">{#478:Loc}</div>
                </div>
                <div class="field-stack-row">
                    <span class="field-title">Lado</span>
                    <div class="field-box">{#477:Lado}</div>
                </div>
                <div class="field-stack-row">
                    <span class="field-title">Prat.</span>
                    <div class="field-box">{#504:Num}</div>
                </div>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="content-panel">
            <div class="assuntos-box">
                <strong>Assunto</strong>
                <div class="assuntos-content">
                    {#entity43:0<446,448>}
                </div>
            </div>

            <div class="logos-strip">
                <div class="logo-card">
                    <img src="uploads/app_logo_1775613339.png" alt="BID">
                </div>
                <div class="logo-card">
                    <img src="uploads/app_logo_1775613366.png" alt="ECM">
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-fields">
            <div class="qrcode-panel">
                {#502:QRCODE}
            </div>
            <div class="caixa-panel">
                <div class="caixa-numero">{#437:Número}</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
